<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="options.css">
  <title id="i18n-title"></title>
</head>
<body>
  <table>
    <tr>
      <td>
        <label for="header_name" id="i18n-header-name-label"></label>
      </td>
      <td>
        <input type="text" id="header_name">
      </td>
    </tr>
    <tr>
      <td>
        <label for="header_prefix" id="i18n-header-prefix-label"></label>
      </td>
      <td>
        <input type="text" id="header_prefix"><br>
        <span id="i18n-header-prefix-hint"></span>
      </td>
    </tr>
    <tr>
      <td>
        <label for="copy_prefix" id="i18n-copy-prefix-label"></label>
      </td>
      <td>
        <input type="checkbox" id="copy_prefix">
      </td>
    </tr>
    <tr>
      <td>
        <label for="allow_empty_prefix" id="i18n-allow-empty-prefix-label"></label>
      </td>
      <td>
        <input type="checkbox" id="allow_empty_prefix">
      </td>
    </tr>
  </table>

  <div id="status"></div>
  <button id="i18n-save" type="button"></button>
  <button id="i18n-reset" type="button"></button>

  <script src="options.js"></script>
</body>
</html>
