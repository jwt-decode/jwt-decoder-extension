<html>
<head>
  <link rel="stylesheet" type="text/css" href="jwt-panel.css">
  <script type="module" src="jwt-panel.js"></script>
</head>
<body>
  <div id="waiting-for-request-container" class="card waiting-for-request">
    <div id="waiting-for-request"></div>
    <div>
      (<b>Header name</b> and <b>Prefix</b> are customizable via <span id="open-settings" style="text-decoration:underline;cursor:pointer;color:blue">extension options</span>)
    </div>
  </div>
  <div id="request-captured" class="card">
    <div id="token-captured"></div>
    <div><span class="info-label">Request URL:</span> <span id="request-url" class="info-text"></span></div>
    <div><span class="info-label">Request Time:</span> <span id="request-time" class="info-text"></span></div>
  </div>
<div>
  <!-- <button id="i18n-copy-token" disabled></button> -->
  <!-- <input type="text" id="token-input" placeholder="Enter JWT token"> -->
</div>
<div class="card">
  <div class="tab-container">
    <div class="tab">RAW JWT</div>
    <div>
      <button id= "clean-input-button" class="tab general-button" disabled>CLEAR</button>
      <button id= "i18n-copy-token" class="tab general-button" disabled>COPY</button>
    </div>
  </div>
  <input type="text" id="token-input" placeholder="Enter JWT token">
</div>
<!-- Decoded Header Section -->
<div id="i18n-decoded-header-label" class="section-title"></div>
<div class="card">
  <div class="tab-container">
    <div class="tab">JSON</div>
    <button id= "copy-header-button" class="tab general-button" disabled>COPY</button>
  </div>
  <pre id="header-json"></pre>
</div>

<!-- Decoded Payload Section -->
<div id="i18n-decoded-payload-label" class="section-title"></div>
<div class="card">
  <div class="tab-container">
    <div class="tab">JSON</div>
    <button id="copy-payload-button" class="tab general-button" disabled>COPY</button>
  </div>
  <pre id="payload-json"></pre>
</div>

<div style="display: flex; justify-content: center; align-items: center; gap: 10px;margin: 20px 0;">
