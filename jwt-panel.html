<html>
<head>
  <link rel="stylesheet" type="text/css" href="jwt-panel.css">
  <script src="encoder.js"></script>
  <script src="jwt-panel.js"></script>
</head>
<body>
  <div id="request-info" class="card" >
    <div id="waiting-for-request"></div>
    <div id="request-captured" display: none;>
      <div><span class="info-label">Request URL:</span> <span id="request-url" class="info-url"></span></div>
      <div><span class="info-label">Request Time:</span> <span id="request-time" class="ts"></span></div>
    </div>
    
  </div>
<div>
  <button id="i18n-copy-token" disabled></button>
</div>
<!-- Decoded Header Section -->
<div class="section-title">DECODED HEADER</div>
<div class="card">
  <div class="tab">JSON</div>
  <pre id="header-json"></pre>
</div>

<!-- Decoded Payload Section -->
<div class="section-title">DECODED PAYLOAD</div>
<div class="card">
  <div class="tab">JSON</div>
  <pre id="payload-json"></pre>
</div>
</body>
</html>
