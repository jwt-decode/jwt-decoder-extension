<html>
<head>
  <link rel="stylesheet" type="text/css" href="jwt-panel.css">
  <script src="encoder.js"></script>
  <script src="jwt-panel.js"></script>
</head>
<body>
  <div id="request-info" class="card" >
    <div id="waiting-for-request"></div>
    <div id="request-captured" display: none;>
      <div><span class="info-label">Request URL:</span> <span id="request-url" class="info-text"></span></div>
      <div><span class="info-label">Request Time:</span> <span id="request-time" class="info-text"></span></div>
    </div>
    
  </div>
<div>
  <button id="i18n-copy-token" disabled></button>
</div>
<!-- Decoded Header Section -->
<div id="i18n-decoded-header-label" class="section-title"></div>
<div class="card">
  <div class="tab-container">
    <div class="tab">JSON</div>
    <button id= "copy-header-button" class="tab copy-button" disabled>COPY</button>
  </div>
  <pre id="header-json"></pre>
</div>

<!-- Decoded Payload Section -->
<div id="i18n-decoded-payload-label" class="section-title"></div>
<div class="card">
  <div class="tab-container">
    <div class="tab">JSON</div>
    <button id="copy-payload-button" class="tab copy-button" disabled>COPY</button>
  </div>
  <pre id="payload-json"></pre>
</div>
</body>
</html>
